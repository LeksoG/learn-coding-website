<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mistral API Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #e53935;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #c62828;
    }
    pre {
      margin-top: 20px;
      width: 80%;
      max-width: 600px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Test Mistral AI Serverless Function</h1>
  <button onclick="testMistral()">Send Test Prompt</button>
  <pre id="output">Click the button to send a test request...</pre>

  <script>
    async function testMistral() {
      const output = document.getElementById("output");
      output.textContent = "⏳ Sending request to Mistral AI...";

      try {
        const res = await fetch("/api/ai-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: "Hello Mistral!" }),
        });

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error("Invalid JSON: " + text);
        }

        if (data.response) {
          output.textContent = "✅ Mistral replied:\n\n" + data.response;
        } else {
          output.textContent = "⚠️ Error:\n\n" + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        console.error(err);
        output.textContent = "❌ Network or server error:\n\n" + err.message;
      }
    }
  </script>
</body>
</html>
